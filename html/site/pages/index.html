<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaBeauty</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- HEADER -->
    <header class="site-header">
        <nav class="navbar navbar-expand-lg sticky-top py-3">
            <div class="container justify-content-between">
                <!-- Logo -->
                <a class="navbar-brand d-flex align-items-center m-0" href="#"><img src="../images/logo.png"
                        alt="Luna Beauty"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarID"
                    aria-controls="navbarID" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- Menu -->
                <div class="collapse navbar-collapse" id="navbarID">
                    <ul class="navbar-nav ms-0 me-auto">
                        <li class="nav-item"><a class="nav-link active" href="index.html">TRANG CHỦ</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">SẢN PHẨM</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">ĐỔI TRẢ</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">GIAO HÀNG</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">LIÊN HỆ</a></li>
                    </ul>
                    <!-- Search -->
                    <div class="header-right d-flex align-items-center gap-4">
                        <form class="search-bar d-flex align-items-center">
                            <input class="form-control me-2 bg-transparent shadow-none" type="text"
                                placeholder="Tìm kiếm sản phẩm...">
                            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </form>
                        <div class="header-hotline">
                            <small class="d-block text-muted">Hotline 24/7</small>
                            <a href="#" class="text-accent">0932.538.468</a>
                        </div>
                        <a href="#" class="icon-btn">
                            <i class="fa-regular fa-user"></i>
                        </a>
                        <!-- Cart -->
                        <a href="#" class="icon-btn cart-btn">
                            <i class="fa-solid fa-bag-shopping"></i>
                            <span class="cart-count">6</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <!-- Hero Banner -->
    <div class="hero-banner container-fluid slideshow">
        <div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"
                    aria-current="true"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" class="active"
                    aria-current="true"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" class="active"
                    aria-current="true"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../images/slider1.png" class="d-block w-100" alt="Slider 1">
                </div>
                <div class="carousel-item">
                    <img src="../images/slider2.png" class="d-block w-100" alt="Slider 2">
                </div>
                <div class="carousel-item">
                    <img src="../images/slider3.png" class="d-block w-100" alt="Slider 3">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev"><i
                    class="fa-solid fa-chevron-left"></i></button>
            <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next"><i
                    class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>
    <!-- FOOTER -->
    <footer>

    </footer>
    <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
